name: CI Pipeline

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [stable, oldstable]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.runtime }} with dependency cache
        uses: actions/setup-go@v5
        with:
          go: ${{ matrix.runtime }}
          cache: true

      - name: Install dependencies
        if: hashFiles('go.mod') != ''
        run: go mod download
        shell: bash

      - name: Check formatting and lint
        if: hashFiles('go.mod') != ''
        run: |
          set -euo pipefail
          gofmt -d .
          go vet ./...
        shell: bash

      - name: Build and typecheck
        if: hashFiles('go.mod') != ''
        run: go build ./...
        shell: bash

      - name: Run unit and integration tests
        if: hashFiles('go.mod') != ''
        run: go test ./...
        shell: bash

      - name: Write pipeline summary
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_GO_OUTCOME: ${{ steps.setup-go.outcome }}
          DEPS_OUTCOME: ${{ steps.dependencies.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          set -euo pipefail
          printf '%s\n' '# CI Pipeline Summary' >> "$GITHUB_STEP_SUMMARY"
          printf '\n| Runtime | Checkout | Go setup | Dependencies | Lint | Build | Tests |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '|---|---|---|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s | %s | %s | %s | %s |\n' \
            '${{ matrix.runtime }}' \
            "${CHECKOUT_OUTCOME:-not-run}" \
            "${SETUP_GO_OUTCOME:-not-run}" \
            "${DEPS_OUTCOME:-not-run}" \
            "${LINT_OUTCOME:-not-run}" \
            "${BUILD_OUTCOME:-not-run}" \
            "${TEST_OUTCOME:-not-run}" >> "$GITHUB_STEP_SUMMARY"
